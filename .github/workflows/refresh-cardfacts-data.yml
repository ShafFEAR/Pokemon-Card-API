name: Refresh PSA CardFacts recent prices

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of every month, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape CardFacts prices and publish
        run: python scripts/publish_cardfacts_data.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/psa-cardfacts/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh PSA CardFacts recent prices"
          git pull --rebase
          git push
